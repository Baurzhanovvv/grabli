[project]
name = "grabli"
version = "0.1.0"
description = "Cross-project journal of a coding agent's past mistakes and decisions, delivered through hooks"
readme = "README.md"
authors = [
    { name = "a.baurzhanov1", email = "amirbaurzhanov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "pathspec>=1.1.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
grabli = "grabli.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
eval = [
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "pymorphy3>=2.0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import the eval harness in evals/
